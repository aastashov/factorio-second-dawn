[sd-note-text]
journal-1=La ŝtono krevis. La homoj ĉirkaŭe estas statuoj. La ŝtoniĝa ondo revenos post 2 horoj; ĝis tiam necesas vekiĝa ĉambro kun ŝargo.\nLa konsilo «Sekva paŝo» maldekstre kondukas ĝis la unua ŝargo. Kion esploro bezonas, tio estas en ĝia priskribo.\nViando resanigas, riparilaro riparas konstruaĵojn. Stano, kupro kaj karbo ne estas mineblaj mane — tio estas epoko 2.
first-steps=Fajrejo el ŝtono kaj ligno igas lignon lignokarbo. Lignokarbo kaj argilo donas tabuletojn; la tabuletoj iras al la skribotablo de klerulo. Sen notoj la esplorado ne progresas.
fruit=Ruĝa foliaro montras fruktarbojn. Aliaj arboj malofte donas fruktojn. Du fruktoj plantitaj en ĝardeno donas ses.
heat=Ceramika forno ne tenas varmon per kruda ligno. Nur lignokarbo. Fajrejo bruligas ion ajn.
jugs=Kruĉoj ne elĉerpiĝas: la alembiko kaj la ĉambro redonas ilin. Tridek kruĉoj sufiĉas por la tuta ciklo.
chamber=La solvaĵo de la ĉambro ne estas eltirebla. Dum ĝi estas ene, la ĉambro haltas. Fari ĝin antaŭe ne helpas — faru ĝin por la ondo.
waves=La intervaloj inter ondoj ĉiufoje mallongiĝas, proksimume je unu okono. Planu.
metal=La fosilo minas argilon, ŝtonon, konkojn kaj salpetron. Metala erco estas tro malmola por ĝi; necesas alia ilo.
charcoal-pit=Ligno entombigita en tero brulas malrapide kaj lasas pli da lignokarbo. Dudek ŝtipoj donas ok pecojn.
lime-acid=Kalko aldonita al salpetro donas la saman acidon per malpli da salpetro, kaj sen lignokarbo.
compost=Fibro putranta en ĝardeno nutras ĝin. La rikolto estas pli granda.
double-firing=Du kruĉoj en unu bakado: malpli da argilo perdiĝas pro fendoj.
cache=Skizo de loko, kie iu kaŝis provizojn antaŭ la ŝtoniĝo.
tin=La helgriza erco ne troviĝas proksime al la tendaro. La plej proksimaj kuŝejoj estas unu tagon da marŝado for. Sen stano ne estas bronzo.
low-tin-bronze=Bronzon oni povas fandi kun duono de la stano: sep partoj da kupro por unu da stano. Pli mola, sed taŭgas por preskaŭ ĉio.
ash-glass=Cindro ĵetita rekte en la fandaĵon funkcias preskaŭ same bone kiel kalio. La boligado estas preterlasebla.
coal-tin=Stana erco pakita kun karbo donas pli da metalo: la karbo forprenas la oksigenon.

