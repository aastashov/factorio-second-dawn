[mod-description]
second-dawn=BETA — Factorio-transformo inspirita de Dr. Stone: de argilo kaj fajro ĝis luna raketo, antaŭ ol la ŝtoniĝaj ondoj revenos. Farita kun AI, gvidata kaj provludata de homo. Baza ludo 2.0; sen Space Age. Maŝina traduko — korektoj estas bonvenaj.
