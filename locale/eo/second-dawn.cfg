wave-weak-charge=Ondo __1__. La ŝargo de la vekiĝa ĉambro estas nivelo __2__, ĉi tiu ondo bezonas nivelon __3__. La statuoj degelos post __4__ min, aŭ tuj kiam la ĉambro faros sufiĉe fortan ŝargon.
raid=Rabobestoj forlasis sian neston __1__ kaj iras al viaj konstruaĵoj.
plantation-hot-only=Kaŭĉukaj plantejoj kreskas nur en la varmega zono (sude de la oceano).
boarding=Vi estas surŝipe: la raketo portas vin al la Luno.
landed=La Luno. La elsendilo estas markita sur la mapo. Atentu vian aeron kaj, se eble, restu for de ĝia pulso.
victory=La elsendilo silentas. La ŝtoniĝo finiĝis: ne plu estos ondoj. La skipo revenos hejmen post 10 sekundoj.
defeat=Ondo __1__ trovis la teamon ankoraŭ ŝtona. Neniu restas por veki iun ajn.

