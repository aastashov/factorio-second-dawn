wave-charged=Ondo __1__. La vekiĝa ĉambro elspezis sian ŝargon: ĉiuj vekiĝos post momento.
wave-no-charge=Ondo __1__. En la vekiĝa ĉambro ne estas ŝargo. La statuoj degelos post __2__ min, aŭ tuj kiam la ĉambro faros ŝargon.
revived-by-chamber=La vekiĝa ĉambro faris ŝargon. Ĉiuj vekiĝas.
