[sd-note-text]
journal-1=La piedra se agrietó. La gente de alrededor son estatuas. La ola de petrificación vuelve en 2 horas; para entonces hace falta una cámara del despertar con carga.\nLa pista «Siguiente paso» de la izquierda lleva hasta la primera carga. Lo que necesita una investigación está en su descripción.\nLa carne cura, un kit de reparación repara edificios. El estaño, el cobre y el carbón no se extraen a mano — eso es la época 2.
first-steps=Una hoguera de piedra y madera convierte la madera en carbón vegetal. Carbón vegetal y arcilla dan tablillas; las tablillas van a la mesa del erudito. Sin registros, la investigación no avanza.
fruit=El follaje rojo señala los árboles frutales. Los demás árboles dan fruta rara vez. Dos frutas plantadas en un huerto dan seis.
heat=Un horno de alfarero no mantiene el calor con madera cruda. Solo carbón vegetal. Una hoguera quema cualquier cosa.
jugs=Las jarras no se gastan: el alambique y la cámara las devuelven. Treinta jarras bastan para todo el ciclo.
chamber=La solución de la cámara no se puede sacar. Mientras está dentro, la cámara se detiene. Hacerla por adelantado no sirve — hazla para la ola.
waves=Los intervalos entre olas se acortan cada vez, más o menos un octavo. Planifica.
metal=La excavadora extrae arcilla, piedra, conchas y salitre. El mineral de metal es demasiado duro para ella; hace falta otra herramienta.
charcoal-pit=La madera enterrada arde despacio y deja más carbón vegetal. Veinte troncos dan ocho piezas.
lime-acid=Cal añadida al salitre da el mismo ácido con menos salitre, y sin carbón vegetal.
compost=La fibra que se pudre en un huerto lo alimenta. La cosecha es mayor.
double-firing=Dos jarras en una cocción: se pierde menos arcilla por grietas.
cache=Un croquis de un lugar donde alguien guardó provisiones antes de la petrificación.
tin=El mineral gris claro no aparece cerca del campamento. Los yacimientos más cercanos están a un día de camino. Sin estaño no hay bronce.
low-tin-bronze=El bronce se puede colar con la mitad de estaño: siete partes de cobre por una de estaño. Más blando, pero sirve para casi todo.
ash-glass=La ceniza echada directamente a la masa fundida funciona casi tan bien como la potasa. Se puede saltar el hervido.
coal-tin=El mineral de estaño empaquetado con carbón da más metal: el carbón se lleva el oxígeno.

