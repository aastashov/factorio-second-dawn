[mod-name]
second-dawn=Second Dawn (beta)

[mod-description]
second-dawn=BETA — Una revisión de Factorio inspirada en Dr. Stone: de la arcilla y el fuego al cohete lunar, antes de que vuelvan las olas de petrificación. Hecho con IA, dirigido y probado por una persona. Juego base 2.0; sin Space Age. Traducción automática — se agradecen correcciones.
