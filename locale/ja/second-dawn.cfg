[sd-note-text]
journal-1=石が割れた。周りの人々は石像だ。石化の波は2時間後に戻ってくる。それまでに復活薬を入れた復活室が必要だ。\n左の「次の一歩」ヒントが最初の復活薬まで導いてくれる。研究に必要なものはその説明にある。\n肉は体力を回復し、修理キットは建物を直す。錫、銅、石炭は手では掘れない — それは時代2の話だ。
first-steps=石と木の焚き火で木材が木炭になる。木炭と粘土で粘土板を作り、粘土板は学者の机へ。記録がなければ研究は進まない。
fruit=赤い葉は果樹の目印。他の木はめったに実をつけない。果樹園に果実を2つ植えると6つになる。
heat=陶窯は生の木では熱を保てない。木炭だけだ。焚き火は何でも燃やす。
jugs=壺はなくならない：蒸留器と復活室が返してくれる。30個あれば全工程に足りる。
chamber=復活室の溶液は取り出せない。入っている間、復活室は止まる。前もって作っても意味がない — 波に合わせて作れ。
waves=波と波の間隔は毎回およそ8分の1ずつ短くなる。計画を立てよ。
metal=掘削機は粘土、石、貝殻、硝石を掘る。金属の鉱石は硬すぎる。別の道具が要る。
charcoal-pit=土に埋めた木はゆっくり燃え、より多くの木炭が残る。丸太20本で8個。
lime-acid=硝石に石灰を加えると、少ない硝石で同じ酸ができ、木炭も要らない。
compost=果樹園で腐る繊維が養分になる。収穫が増える。
double-firing=1回の焼成で壺2つ：ひび割れで失う粘土が減る。
cache=石化の前に誰かが物資を隠した場所の略図。
tin=薄い灰色の鉱石はキャンプの近くにはない。最寄りの鉱床は1日歩いた先だ。錫がなければ青銅もない。
low-tin-bronze=青銅は錫を半分にしても鋳造できる：銅7に錫1。柔らかいが、ほとんどの用途に足りる。
ash-glass=灰を直接溶融物に入れても、カリとほぼ同じように働く。煮出しを省ける。
coal-tin=石炭と一緒に詰めた錫鉱石はより多くの金属を出す：石炭が酸素を奪う。

