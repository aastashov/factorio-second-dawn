[mod-name]
second-dawn=Second Dawn（ベータ）

[mod-description]
second-dawn=ベータ版 — 『Dr.STONE』に着想を得たFactorioのオーバーホール：粘土と火から月へのロケットまで、石化の波が戻る前に。AIで制作し、人間が監督とテストプレイを担当。ベースゲーム2.0、Space Age非対応。機械翻訳 — 修正を歓迎します。
