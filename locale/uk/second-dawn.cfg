chamber-exists=Камера пробудження може бути лише одна на команду.
wave-weak-charge=Хвиля __1__. У камері пробудження заряд рівня __2__, а ця хвиля потребує рівня __3__. Статуї відтануть через __4__ хв або щойно камера зробить заряд потрібної сили.
raid=Хижаки вийшли з лігва __1__ і йдуть до ваших будівель.
plantation-hot-only=Каучуконоси ростуть тільки в спекотному поясі (південніше океану).
boarding=Ви на борту: ракета несе вас на Місяць.
landed=Місяць. Випромінювач позначено на карті. Стежте за повітрям і по змозі тримайтеся подалі від його пульсу.
victory=Випромінювач замовк. Скам'яніння більше не буде: хвиль немає. Екіпаж повернеться додому через 10 секунд.
defeat=Хвиля __1__ застала команду ще каменем. Будити більше нікому.

