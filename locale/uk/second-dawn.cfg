[mod-name]
second-dawn=Second Dawn (бета)

[mod-description]
second-dawn=БЕТА — переробка Factorio за мотивами Dr. Stone: від глини й вогню до ракети на Місяць, перш ніж повернуться хвилі скам'яніння. Створено з ШІ, під керівництвом і з ігровим тестуванням людини. Factorio 2.0, без Space Age. Машинний переклад — виправлення вітаються.
