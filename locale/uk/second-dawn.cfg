[sd-message]
note-read=Прочитано записку: __1__. Вона в щоденнику (J).
intro=Польовий журнал, день перший. Камінь тріснув — я знову можу рухатися. Порядок робіт записано в щоденнику (J).
newcomer=Ви щойно були каменем. Рухатися зможете через 3 хвилини.
