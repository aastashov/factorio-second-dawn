[sd-note-text]
journal-1=Камінь тріснув. Люди довкола — статуї. Хвиля скам'яніння повернеться через 2 години, до неї потрібна камера пробудження із зарядом.\nПідказка «Наступний крок» ліворуч веде до першого заряду. Що потрібно для дослідження — в його описі.\nЛікує м'ясо, будівлі лагодить ремонтний набір. Олово, мідь і вугілля руками не добути — це епоха 2.
first-steps=Багаття з каменю й деревини перетворює деревину на вугілля. Вугілля й глина дають таблички, таблички йдуть на стіл ученого. Без записів дослідження не рухаються.
fruit=Червоне листя — плодові дерева. З інших плоди падають рідко. Два плоди на городі дають шість.
heat=Піч для випалу не тримає жар на сирих дровах. Тільки вугілля. Багаття горить на чому завгодно.
jugs=Глечики не витрачаються: перегінний куб і камера повертають їх. Тридцяти глечиків вистачає на весь цикл.
chamber=Розчин із камери не вийняти. Поки він усередині, камера стоїть. Робити про запас марно — тільки до хвилі.
waves=Проміжки між хвилями щоразу коротші, приблизно на восьму частину. Рахувати треба заздалегідь.
metal=Копач бере глину, камінь, черепашник і селітру. Руда для нього надто тверда, потрібен інший інструмент.
charcoal-pit=Дрова, засипані землею, тліють повільно й дають більше вугілля. Двадцять полін — вісім вуглин.
lime-acid=Якщо додати до селітри вапно, кислоти виходить стільки ж за меншої селітри, і вугілля не потрібне.
compost=Волокно, що перегнило в грядці, удобрює її. Урожай вищий.
double-firing=Два глечики в одній закладці: менше глини йде в брак.
cache=Начерк місця, де хтось до скам'яніння склав запаси.
tin=Світло-сірої руди біля табору немає. Найближчі поклади — за день шляху. Без олова немає бронзи.
low-tin-bronze=Бронзу можна лити з половиною олова: сім частин міді на одну олова. М'якша, але для більшості робіт годиться.
ash-glass=Попіл, кинутий просто в розплав, працює майже як поташ. Випарювання можна пропустити.
coal-tin=Олов'яна руда, пересипана вугіллям, дає більше металу: вугілля забирає кисень.

