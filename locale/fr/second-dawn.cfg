[mod-name]
second-dawn=Second Dawn (bêta)

[mod-description]
second-dawn=BÊTA — Une refonte de Factorio inspirée de Dr. Stone : de l'argile et du feu jusqu'à la fusée lunaire, avant le retour des vagues de pétrification. Créé avec l'IA, dirigé et testé en jeu par un humain. Jeu de base 2.0 ; sans Space Age. Traduction automatique — corrections bienvenues.
