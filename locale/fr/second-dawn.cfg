[sd-note-text]
journal-1=La pierre a craqué. Les gens autour sont des statues. La vague de pétrification revient dans 2 heures ; il faut d'ici là une chambre d'éveil avec une charge.\nL'indice « Étape suivante » à gauche mène à la première charge. Ce qu'exige une recherche est dans sa description.\nLa viande soigne, un kit de réparation répare les bâtiments. L'étain, le cuivre et le charbon ne s'extraient pas à la main — c'est l'époque 2.
first-steps=Un feu de camp de pierre et de bois transforme le bois en charbon de bois. Charbon de bois et argile font des tablettes ; les tablettes vont sur le bureau du savant. Sans écrits, la recherche n'avance pas.
fruit=Un feuillage rouge signale les arbres fruitiers. Les autres arbres donnent rarement des fruits. Deux fruits plantés dans un potager en donnent six.
heat=Un four à céramique ne tient pas sa chaleur au bois brut. Charbon de bois uniquement. Un feu de camp brûle n'importe quoi.
jugs=Les cruches ne s'usent pas : l'alambic et la chambre les rendent. Trente cruches suffisent pour tout le cycle.
chamber=La solution dans la chambre ne peut pas être retirée. Tant qu'elle y est, la chambre reste à l'arrêt. La préparer d'avance ne sert à rien — préparez-la pour la vague.
waves=L'intervalle entre les vagues raccourcit à chaque fois, d'environ un huitième. Anticipez.
metal=L'excavatrice prend l'argile, la pierre, les coquillages et le salpêtre. Le minerai de métal est trop dur pour elle ; il faut un autre outil.
charcoal-pit=Du bois enfoui sous la terre se consume lentement et laisse plus de charbon de bois. Vingt rondins donnent huit morceaux.
lime-acid=De la chaux ajoutée au salpêtre donne le même acide avec moins de salpêtre, et sans charbon de bois.
compost=La fibre qui pourrit dans un potager le nourrit. La récolte est plus grande.
double-firing=Deux cruches en une cuisson : moins d'argile perdue en fissures.
cache=Le croquis d'un endroit où quelqu'un a stocké des provisions avant la pétrification.
tin=Le minerai gris clair ne se trouve pas près du camp. Les gisements les plus proches sont à une journée de marche. Sans étain, pas de bronze.
low-tin-bronze=On peut couler le bronze avec moitié moins d'étain : sept parts de cuivre pour une d'étain. Plus tendre, mais suffisant pour la plupart des travaux.
ash-glass=De la cendre jetée directement dans la fonte agit presque aussi bien que la potasse. On peut sauter l'étape d'ébullition.
coal-tin=Du minerai d'étain tassé avec du charbon donne plus de métal : le charbon emporte l'oxygène.

