[sd-note-text]
journal-1=A pedra rachou. As pessoas ao redor são estátuas. A onda de petrificação volta em 2 horas; até lá é preciso uma câmara do despertar com carga.\nA dica «Próximo passo» à esquerda leva até a primeira carga. O que uma pesquisa exige está na descrição dela.\nA carne cura, um kit de reparo conserta edifícios. Estanho, cobre e carvão não se extraem à mão — isso é a época 2.
first-steps=Uma fogueira de pedra e madeira transforma madeira em carvão vegetal. Carvão vegetal e argila dão tábuas; as tábuas vão para a mesa do erudito. Sem registros, a pesquisa não avança.
fruit=Folhagem vermelha indica árvores frutíferas. As outras árvores dão frutas raramente. Duas frutas plantadas numa horta dão seis.
heat=Um forno de oleiro não mantém o calor com madeira crua. Só carvão vegetal. Uma fogueira queima qualquer coisa.
jugs=Os jarros não se gastam: o alambique e a câmara os devolvem. Trinta jarros bastam para o ciclo inteiro.
chamber=A solução da câmara não pode ser retirada. Enquanto está dentro, a câmara para. Fazer de antemão não adianta — faça para a onda.
waves=Os intervalos entre as ondas encurtam a cada vez, mais ou menos um oitavo. Planeje.
metal=A escavadeira extrai argila, pedra, conchas e salitre. O minério de metal é duro demais para ela; é preciso outra ferramenta.
charcoal-pit=Madeira enterrada queima devagar e deixa mais carvão vegetal. Vinte toras dão oito pedaços.
lime-acid=Cal adicionada ao salitre dá o mesmo ácido com menos salitre, e sem carvão vegetal.
compost=Fibra apodrecendo numa horta a alimenta. A colheita é maior.
double-firing=Dois jarros numa queima: perde-se menos argila com rachaduras.
cache=Um esboço de um lugar onde alguém guardou mantimentos antes da petrificação.
tin=O minério cinza-claro não aparece perto do acampamento. As jazidas mais próximas ficam a um dia de caminhada. Sem estanho não há bronze.
low-tin-bronze=O bronze pode ser fundido com metade do estanho: sete partes de cobre para uma de estanho. Mais mole, mas serve para quase tudo.
ash-glass=Cinza jogada direto na massa fundida funciona quase tão bem quanto potassa. Dá para pular a fervura.
coal-tin=Minério de estanho compactado com carvão rende mais metal: o carvão leva o oxigênio embora.

