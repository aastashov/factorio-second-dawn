[mod-name]
second-dawn=Second Dawn (beta)

[mod-description]
second-dawn=BETA — Uma reformulação de Factorio inspirada em Dr. Stone: da argila e do fogo ao foguete lunar, antes que as ondas de petrificação voltem. Feito com IA, dirigido e testado por uma pessoa. Jogo base 2.0; sem Space Age. Tradução automática — correções são bem-vindas.
