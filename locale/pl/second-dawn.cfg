[sd-message]
note-read=Notatka przeczytana: __1__. Znajduje się w dzienniku (J).
intro=Dziennik terenowy, dzień pierwszy. Kamień pękł i znów mogę się poruszać. Kolejność zadań znajduje się w dzienniku (J).
newcomer=Jeszcze przed chwilą byłeś skamieniały. Będziesz mógł się poruszać za 3 minuty.
wave-warning=Fala skamienienia nadejdzie za __1__ min.
wave-charged=Fala __1__. Komora ożywienia zużyła swój ładunek: wszyscy obudzą się za chwilę.
wave-no-charge=Fala __1__. Brak ładunku w komorze ożywienia. Posągi odkamienieją za __2__ min lub gdy tylko komora zgromadzi ładunek.
revived-by-chamber=Komora ożywienia zgromadziła ładunek. Wszyscy się budzą.
thawed=Kamień pękł samoczynnie. Możesz się znowu poruszać.
chamber-exists=Tylko jedna komora ożywienia na drużynę.
wave-weak-charge=Fala __1__. Ładunek w komorze ożywienia ma poziom __2__, a ta fala wymaga poziomu __3__. Posągi rozmrożą się za __4__ minuty lub gdy tylko komora zgromadzi wystarczająco silny ładunek.
raid=Drapieżniki opuściły swoją kryjówkę __1__ i zmierzają w kierunku twoich budynków.
plantation-hot-only=Plantacje kauczuku rosną wyłącznie w pasie gorącym (na południe od oceanu).
boarding=Jesteś na pokładzie: rakieta zabierze cię na Księżyc.
landed=Księżyc. Nadajnik jest zaznaczony na mapie. Uważaj na powietrze i trzymaj się z dala od jego impulsów, jeśli to możliwe.
victory=Nadajnik milczy. Skamienienie dobiegło końca: nie ma już fal. Załoga wraca do domu za 10 sekund.
defeat=Fala __1__ zastała drużynę wciąż skamienioną. Nie ma już nikogo, kto mógłby kogoś obudzić.

