[sd-note-text]
journal-1=Kamień pękł. Ludzie wokół to posągi. Fala skamienienia powróci za 2 godziny; do tego czasu potrzebna jest komora ożywienia z ładunkiem.\nWskazówka dotycząca kolejnego kroku po lewej stronie prowadzi do pierwszego ładunku. To, czego wymaga dane badanie, znajduje się w jego opisie.\nMięso leczy, a zestaw naprawczy naprawia budynki. Cyny, miedzi i węgla nie da się wydobywać ręcznie — to już epoka 2.
first-steps=Ognisko z kamienia i drewna zamienia drewno w węgiel drzewny. Z węgla drzewnego i gliny powstają tabliczki; tabliczki kładzie się na biurku uczonego. Bez możliwości spisania badania nie posuwają się naprzód.
fruit=Czerwone liście oznaczają drzewa owocowe. Inne drzewa rzadko zrzucają owoce. Dwa owoce posadzone na działce ogrodowej dają sześć.
heat=Piec nie utrzymuje ciepła przy spalaniu surowego drewna. Tylko węgiel drzewny. Ognisko spala wszystko.
jugs=Dzbany nie zużywają się: alembik i komora je zwracają. Trzydzieści dzbanów wystarcza na cały cykl.
chamber=Roztworu z komory nie można wyjąć. Dopóki się w niej znajduje, komora stoi w miejscu. Przygotowywanie go z wyprzedzeniem nie ma sensu — przygotuj go na falę.
waves=Odstępy między falami za każdym razem skracają się o około jedną ósmą. Planuj z wyprzedzeniem.
metal=Koparka zbiera glinę, kamień, muszle i saletrę. Ruda metalu jest dla niego zbyt twarda; potrzebne jest inne narzędzie.
charcoal-pit=Drewno zakopane pod ziemią tli się powoli i pozostawia więcej węgla drzewnego. Dwadzieścia kłód daje osiem kawałków.
lime-acid=Wapno dodane do saletry daje ten sam kwas przy mniejszej ilości saletry, a węgiel drzewny nie jest potrzebny.
compost=Gnijące włókna w grządce ogrodowej odżywiają ją. Zbiory są większe.
double-firing=Dwa dzbany w jednym wypalaniu: mniej gliny traci się z powodu pęknięć.
cache=Szkic miejsca, w którym ktoś przechowywał zapasy przed skamienieniem.
tin=W pobliżu obozu nie występuje jasnoszara ruda. Najbliższe złoża znajdują się w odległości jednego dnia marszu. Bez cyny nie ma brązu.
low-tin-bronze=Brąz można odlewać przy użyciu połowy ilości cyny: siedem części miedzi na jedną część cyny. Jest bardziej miękki, ale wystarczająco dobry do większości prac.
ash-glass=Popiół wrzucony bezpośrednio do stopu działa prawie tak samo dobrze jak potaż. Można pominąć etap redukcji.
coal-tin=Ruda cyny zapakowana z węglem daje więcej metalu: węgiel pochłania tlen.

