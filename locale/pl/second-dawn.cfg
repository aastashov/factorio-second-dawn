[mod-name]
second-dawn=Second Dawn (beta)

[mod-description]
second-dawn=BETA — Od gliny i ognia do rakiety księżycowej, zanim powrócą fale petryfikacji. Pięć epok, wyprawy, statki i klimat. Baza 2.0; bez Space Age.
