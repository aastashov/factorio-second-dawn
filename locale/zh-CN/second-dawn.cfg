[sd-note-text]
journal-1=石头裂开了。周围的人都是石像。石化浪潮 2 小时后会再来；在那之前需要一座装好复苏剂的复苏舱。\n左侧的“下一步”提示会带你做出第一份复苏剂。研究需要什么，都写在它的说明里。\n肉可以治疗，维修包可以修理建筑。锡、铜和煤不能手工开采——那是第 2 时代的事。
first-steps=用石头和木头搭的篝火能把木头烧成木炭。木炭和黏土做成泥板；泥板放进学者书桌。没有记录，研究就无法推进。
fruit=红色树叶标记着果树。其他树很少结果。在果园里种下两颗果子，能收获六颗。
heat=陶窑用生木头保不住温度。只能用木炭。篝火什么都能烧。
jugs=陶罐不会消耗：蒸馏器和复苏舱会把它们还回来。三十个陶罐足够整个循环。
chamber=复苏舱里的溶液无法取出。溶液在里面时，复苏舱会停工。提前做没用——为浪潮而做。
waves=浪潮之间的间隔每次都会缩短，大约八分之一。提前规划。
metal=挖掘机能采黏土、石头、贝壳和硝石。金属矿对它来说太硬了；需要别的工具。
charcoal-pit=埋在土里的木头慢慢燃烧，留下更多木炭。二十根原木得到八块。
lime-acid=在硝石中加入石灰，能用更少的硝石得到同样的酸，而且不用木炭。
compost=在果园里腐烂的纤维能滋养它。收成更多。
double-firing=一窑烧两个罐子：因开裂损失的黏土更少。
cache=一张草图，画着有人在石化前藏补给的地方。
tin=营地附近没有浅灰色的矿石。最近的矿床要走一天。没有锡就没有青铜。
low-tin-bronze=青铜可以只用一半的锡来铸造：七份铜配一份锡。更软，但几乎什么都能用。
ash-glass=灰烬直接撒进熔体，效果几乎和钾碱一样好。可以省去熬煮。
coal-tin=和煤压在一起的锡矿出金属更多：煤把氧带走了。

