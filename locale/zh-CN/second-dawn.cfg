[mod-description]
second-dawn=测试版——受《石纪元》启发的 Factorio 大修模组：从黏土和火到登月火箭，赶在石化浪潮再次来临之前。由 AI 制作，由人类指导并试玩。基础游戏 2.0；不含太空时代。机器翻译——欢迎指正。
