[mod-name]
second-dawn=Second Dawn (Beta)

[mod-description]
second-dawn=BETA — Eine Factorio-Überarbeitung, inspiriert von Dr. Stone: von Lehm und Feuer bis zur Mondrakete, bevor die Versteinerungswellen zurückkehren. Mit KI erstellt, von einem Menschen geleitet und getestet. Basisspiel 2.0; ohne Space Age. Maschinelle Übersetzung — Korrekturen willkommen.
