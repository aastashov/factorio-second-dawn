victory=Der Emitter schweigt. Die Versteinerung ist vorbei: keine Wellen mehr. Die Besatzung kehrt in 10 Sekunden heim.
defeat=Welle __1__ hat das Team noch aus Stein vorgefunden. Niemand ist mehr da, um jemanden zu wecken.

