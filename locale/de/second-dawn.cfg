[sd-note-text]
journal-1=Der Stein ist gesprungen. Die Menschen ringsum sind Statuen. Die Versteinerungswelle kehrt in 2 Stunden zurück; bis dahin wird eine Erweckungskammer mit Ladung gebraucht.\nDer Hinweis „Nächster Schritt“ links führt zur ersten Ladung. Was eine Forschung braucht, steht in ihrer Beschreibung.\nFleisch heilt, ein Reparaturset repariert Gebäude. Zinn, Kupfer und Kohle lassen sich nicht von Hand abbauen — das ist Epoche 2.
first-steps=Ein Lagerfeuer aus Stein und Holz macht aus Holz Holzkohle. Holzkohle und Lehm ergeben Tafeln; Tafeln kommen auf den Gelehrtentisch. Ohne Aufzeichnungen kommt die Forschung nicht voran.
fruit=Rotes Laub zeigt Obstbäume an. Andere Bäume werfen selten Früchte ab. Zwei Früchte in einem Gartenbeet ergeben sechs.
heat=Ein Brennofen hält seine Hitze nicht mit rohem Holz. Nur Holzkohle. Ein Lagerfeuer brennt mit allem.
jugs=Krüge werden nicht verbraucht: Destillierkolben und Kammer geben sie zurück. Dreißig Krüge reichen für den ganzen Kreislauf.
chamber=Die Lösung in der Kammer lässt sich nicht herausnehmen. Solange sie drin ist, steht die Kammer still. Sie im Voraus herzustellen ist sinnlos — stelle sie für die Welle her.
waves=Die Abstände zwischen den Wellen werden jedes Mal kürzer, um etwa ein Achtel. Plane voraus.
metal=Das Grabwerk nimmt Lehm, Stein, Muscheln und Salpeter. Metallerz ist ihm zu hart; ein anderes Werkzeug wird gebraucht.
charcoal-pit=Unter Erde vergrabenes Holz schwelt langsam und hinterlässt mehr Holzkohle. Zwanzig Stämme ergeben acht Stücke.
lime-acid=Kalk zum Salpeter gibt dieselbe Säure aus weniger Salpeter, und Holzkohle ist nicht nötig.
compost=Faser, die in einem Gartenbeet verrottet, nährt es. Die Ernte ist größer.
double-firing=Zwei Krüge in einem Brand: weniger Lehm geht durch Risse verloren.
cache=Eine Skizze eines Ortes, an dem jemand vor der Versteinerung Vorräte gelagert hat.
tin=Hellgraues Erz kommt in der Nähe des Lagers nicht vor. Die nächsten Vorkommen sind einen Tagesmarsch entfernt. Ohne Zinn keine Bronze.
low-tin-bronze=Bronze lässt sich mit halb so viel Zinn gießen: sieben Teile Kupfer auf einen Teil Zinn. Weicher, aber für die meisten Arbeiten gut genug.
ash-glass=Asche direkt in die Schmelze geworfen wirkt fast so gut wie Pottasche. Das Einkochen kann entfallen.
coal-tin=Zinnerz, mit Kohle gepackt, gibt mehr Metall: Die Kohle nimmt den Sauerstoff weg.

