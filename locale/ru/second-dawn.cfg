[sd-message]
note-read=Прочитана записка: __1__. Она в дневнике (J).
intro=Полевой журнал, день первый. Камень треснул — я снова могу двигаться. Порядок работ записан в дневнике (J).
newcomer=Вы только что были камнем. Двигаться сможете через 3 минуты.
wave-warning=Волна окаменения через __1__ мин.
wave-charged=Волна __1__. Камера пробуждения потратила заряд: все оживут через мгновение.
wave-no-charge=Волна __1__. В камере пробуждения нет заряда. Статуи оттают через __2__ мин или как только камера сделает заряд.
revived-by-chamber=Камера пробуждения сделала заряд. Все оживают.
thawed=Камень треснул сам. Можно двигаться.
chamber-exists=Камера пробуждения может быть только одна на команду.
wave-weak-charge=Волна __1__. В камере пробуждения заряд уровня __2__, а эта волна требует уровень __3__. Статуи оттают через __4__ мин или как только камера сделает заряд нужной силы.
raid=Хищники вышли из логова __1__ и идут к вашим постройкам.
captured=Поймано! На месте логова теперь: __1__.
capture-guarded=Сеть не помогла: звери ещё рядом. Перебейте их, дождитесь, пока уйдут, или бросайте во время волны окаменения.
capture-no-lair=Там, куда упала сеть, нет логова.
plantation-hot-only=Каучуконосы растут только в жарком поясе (южнее океана).
boarding=Вы на борту: ракета несёт вас на Луну.
landed=Луна. Излучатель отмечен на карте. Следите за воздухом и по возможности держитесь подальше от его пульса.
victory=Излучатель замолчал. Окаменения больше не будет: волн нет. Экипаж вернётся домой через 10 секунд.
defeat=Волна __1__ застала команду всё ещё камнем. Будить больше некому.

