[item-description]
sd-charcoal=Печи для обжига, перегонные кубы и камера пробуждения горят только на древесном угле.
sd-clay-tablet=Записи, выдавленные в глине. Нужны для исследований.
sd-glass-flask=Вторая наука: стеклянная посуда для опытов. Нужна для исследований.
sd-meat=Съесть: лечит 20.
sd-cooked-meat=Съесть: лечит 60.
sd-mechanism=Третья наука: шестерни, провод и сталь. Нужна для исследований.
sd-net=Бросьте в логово, чтобы поймать его. Сработает, только если рядом нет его зверей или они окаменели.
sd-fur-coat=Без неё в холодном поясе не выжить.
sd-light-cloak=Без неё в жарком поясе не выжить.
sd-deep-landfill=Засыпает глубокую воду. Обычная засыпка кладётся только на мелководье у берегов.
landfill=Засыпает мелкую воду: шельф у берегов и озёра. Для глубокой нужна глубинная засыпка.
sd-waterway=Прокладывается как рельсы, но только по воде: шельф или открытое море.
sd-briquettes=Корабли и поезда на брикетах идут на 15% быстрее и на 20% быстрее разгоняются.
sd-pitch=Конопатка для любого корпуса.
sd-reactive=Четвёртая наука: серная кислота и каучук с юга. Нужна для исследований.
sd-navigation=Пятая наука: вольфрам с севера. Нужна для исследований.
sd-fuel-oil=Корабли на нефтяном топливе идут на 30% быстрее и на 50% быстрее разгоняются.
sd-board=Шестая наука: электроника и вольфрам. Нужна для исследований.
sd-spacesuit=5 минут воздуха на Луне. Защищает и в холодном, и в жарком поясе.
sd-oxygen-tank=Ещё 2 минуты воздуха на Луне; тратится сам, когда воздух на исходе.

