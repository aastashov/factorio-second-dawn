sd-cooling=С водяными охладителями машины в жарком поясе работают в полную силу.
sd-land-reclamation=Засыпка для мелкой воды.
sd-deep-landfill=Засыпка для глубокой воды: можно, но корабль дешевле.
sd-pitch=Дерево, перегнанное в смолу, остаётся уголь.
sd-shipbuilding=Фарватер, паровой буксир, баржи и причалы: путь на дальние материки.
sd-buoys=Буи и цепные буи разводят корабли, как сигналы поезда.
sd-fluid-barges=Баржи для нефти и других жидкостей.
sd-briquettes=Топливо, с которым корабли идут на 15% быстрее.
sd-braking-1=Корабли тормозят позже и приходят раньше.
sd-braking-2=Корабли тормозят позже и приходят раньше.
