sd-digger=Копать мягкие породы, не копая самому.
sd-quicklime=Обожжённые ракушки дают известь; известь и камень дают раствор.
sd-fermentation=Вырастить плоды и дать им забродить.
sd-distillation=Спирт из браги, азотная кислота из селитры.
sd-awakening=Камера пробуждения: просыпаться из камня, не дожидаясь.

