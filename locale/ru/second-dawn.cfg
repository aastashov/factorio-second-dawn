[sd-message]
note-read=Прочитана записка: __1__. Она в дневнике (J).
intro=Полевой журнал, день первый. Камень вокруг меня треснул, я снова могу двигаться. Всё заросло, люди — статуи. Сначала глина, огонь и камень.
newcomer=Вы только что были камнем. Двигаться сможете через 3 минуты.
wave-warning=Волна окаменения через __1__ мин.
wave-charged=Волна __1__. Камера пробуждения потратила заряд: все оживут через мгновение.
wave-no-charge=Волна __1__. В камере пробуждения нет заряда. Статуи оттают через __2__ мин или как только камера сделает заряд.
revived-by-chamber=Камера пробуждения сделала заряд. Все оживают.
thawed=Камень треснул сам. Можно двигаться.
chamber-exists=Камера пробуждения может быть только одна на команду.
to-be-continued=Это была последняя волна этой версии. Следующие эпохи — в новых версиях.

