[mod-setting-description]
sd-wave-difficulty=Как часто приходят волны окаменения. Спокойно: интервалы ×1.5. Жёстко: ×0.7. Выкл: волн нет.
sd-petrify-newcomers=Игрок, присоединившийся к идущей игре, начинает статуей и оживает через 3 минуты.
sd-wildlife=Мирные: звери не нападают. Спокойные: защищают логова, но в набеги не ходят. Обычные: хищники иногда нападают ночью. Опасные: набеги чаще, стаи больше.
sd-climate-distance=Сколько клеток от старта до холодного пояса (на север) и до жаркого (на юг).
sd-continents=Стартовый материк, а холодный и жаркий пояса — за океаном. Выкл.: обычная суша Нувиса с поясами. Действует на новые карты.

