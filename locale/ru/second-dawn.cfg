[sd-note-text]
journal-1=Камень вокруг меня треснул, я снова могу двигаться. Всё заросло, люди вокруг — статуи. Первые задачи: огонь, глина, записи. Всё, что узнаю, записываю в этот журнал. (Открывается клавишей J.)
first-steps=Костёр из камня и дерева превращает дерево в уголь. Уголь и глина дают таблички, таблички идут на стол учёного. Без записей исследования не движутся.
fruit=Красная листва — плодовые деревья. С остальных плоды падают редко. Два плода на огороде дают шесть.
heat=Печь для обжига не держит жар на сырых дровах. Только уголь. Костёр горит на чём угодно.
jugs=Кувшины не расходуются: перегонный куб и камера возвращают их. Тридцати кувшинов хватает на весь цикл.
chamber=Раствор из камеры не вынуть. Пока он внутри, камера стоит. Делать впрок бессмысленно — только к волне.
waves=Промежутки между волнами с каждым разом короче, примерно на восьмую часть. Считать нужно заранее.
metal=Копатель берёт глину, камень, ракушечник и селитру. Руда для него слишком твёрдая, нужен другой инструмент.
charcoal-pit=Дрова, засыпанные землёй, тлеют медленно и дают больше угля. Двадцать поленьев — восемь углей.
lime-acid=Если добавить к селитре известь, кислоты выходит столько же при меньшей селитре, и уголь не нужен.
compost=Волокно, перегнившее в грядке, удобряет её. Урожай выше.
double-firing=Два кувшина в одной закладке: меньше глины уходит в брак.
cache=Набросок места, где кто-то до окаменения сложил запасы.
tin=Светло-серая руда возле лагеря не встречается. Ближайшие залежи — в дне пути. Без олова нет бронзы.
low-tin-bronze=Бронзу можно лить с половиной олова: семь частей меди на одну олова. Мягче, но для большинства работ годится.
ash-glass=Зола, брошенная прямо в расплав, работает почти как поташ. Выпаривание можно пропустить.
coal-tin=Оловянная руда, пересыпанная углём, даёт больше металла: уголь забирает кислород.
