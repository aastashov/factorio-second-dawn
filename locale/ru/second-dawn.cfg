[entity-description]
sd-kiln=Горит только на древесном угле.
sd-alembic=Горит только на древесном угле.
sd-revival-chamber=Делает заряд пробуждения в закрытый резервуар. Когда приходит волна окаменения, заряд тратится и вся команда сразу оживает. Одна на команду; стоит, пока в ней есть заряд. Горит только на древесном угле.
sd-digger=Добывает мягкие породы: камень, глину, ракушечник, селитру.
sd-note=Подберите, чтобы прочитать. Прочитанное узнает вся команда.
sd-pick-digger=Медленно добывает мягкие и твёрдые породы.
sd-bronze-drill=Добывает мягкие и твёрдые породы.
sd-bloomery=Плавит медь и олово, сплавляет бронзу. Горит на древесном или каменном угле.
sd-glassworks=Варит стекло и выдувает бутыли. Горит на древесном или каменном угле.
sd-wolf-lair=Волки нападают на всех, кто подойдёт ближе 25 клеток, и ночью ходят в набеги.
sd-boar-lair=Кабаны нападают на всех, кто подойдёт ближе 25 клеток. В набеги не ходят.
sd-bear-den=Медведи нападают на всех, кто подойдёт ближе 25 клеток, и ночью ходят в набеги.
sd-crossbow=Сам стреляет стрелами по зверям в радиусе.
sd-revival-chamber-2=Делает заряды пробуждения I–III. Ставится поверх старой камеры; заряд в старой пропадает. Одна на команду.
sd-boar-farm=Пойманные кабаны: на входе корм, на выходе мясо, шкуры и кости.
sd-wolf-kennel=Пойманные волки: на входе мясо, на выходе шкуры и кости.
sd-bear-pen=Пойманные медведи: на входе корм, на выходе мясо, шкуры и кости.
steel-furnace=Плавит железную руду и делает сталь. Горит на каменном или древесном угле.

