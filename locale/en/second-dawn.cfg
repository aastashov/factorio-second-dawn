[mod-description]
second-dawn=BETA — A Factorio overhaul inspired by Dr. Stone: from clay and fire to a Moon rocket before petrification waves return. Made with AI, directed and playtested by a human. Base 2.0; no Space Age. Languages: English, Russian, Polish, German, French, Spanish, Portuguese (BR), Chinese, Japanese, Ukrainian — more on request. Known issues: balance, animations and art in general — feedback or GitHub pull requests are very welcome.
