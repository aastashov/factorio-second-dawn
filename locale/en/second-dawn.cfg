[sd-note-text]
journal-1=The stone cracked. The people around are statues. The petrification wave returns in 2 hours; a revival chamber with a charge is needed by then.\nThe Next step hint on the left leads to the first charge. What a research takes is in its description.\nMeat heals, a repair kit repairs buildings. Tin, copper and coal can't be mined by hand — that is epoch 2.
first-steps=A campfire of stone and wood turns wood into charcoal. Charcoal and clay make tablets; tablets go on the scholar's desk. Without records, research does not move.
fruit=Red foliage marks fruit trees. Other trees drop fruit rarely. Two fruits planted in a garden plot give six.
heat=A kiln does not hold its heat on raw wood. Charcoal only. A campfire burns anything.
jugs=Jugs are not used up: the alembic and the chamber give them back. Thirty jugs are enough for the whole cycle.
chamber=The solution in the chamber cannot be taken out. While it is inside, the chamber stands still. Making it in advance is pointless — make it for the wave.
waves=The gaps between waves get shorter every time, by about one eighth. Plan ahead.
metal=The digger takes clay, stone, shells and saltpeter. Metal ore is too hard for it; another tool is needed.
charcoal-pit=Wood buried under earth smoulders slowly and leaves more charcoal. Twenty logs give eight pieces.
lime-acid=Lime added to saltpeter gives the same acid from less saltpeter, and no charcoal is needed.
compost=Fiber rotting in a garden bed feeds it. The harvest is larger.
double-firing=Two jugs in one firing: less clay is lost to cracks.
cache=A sketch of a place where someone stored supplies before the petrification.
tin=Light-grey ore does not occur near the camp. The nearest deposits are a day's walk away. Without tin there is no bronze.
low-tin-bronze=Bronze can be poured with half the tin: seven parts copper to one of tin. Softer, but good enough for most work.
ash-glass=Ash thrown straight into the melt works almost as well as potash. The boiling-down step can be skipped.
coal-tin=Tin ore packed with coal gives more metal: the coal takes the oxygen away.

