[technology-description]
sd-pottery=Fired clay: bricks, jugs and a proper kiln.
sd-workbench=A place to craft while you do something else.
sd-levers=Move things without carrying them.
sd-digger=Dig soft rock without digging yourself.
sd-quicklime=Burnt shells make lime; lime and stone make mortar.
sd-fermentation=Grow fruit and let it ferment.
sd-distillation=Spirit from mash, nitric acid from saltpeter.
sd-awakening=The revival chamber: wake up from stone without waiting.
sd-mining=A digger that bites into hard rock: copper, tin, coal.
sd-smelting=Copper and tin from ore.
sd-millstone=Stone ground into sand.
sd-potash=Wood ash leached and boiled down.
sd-glass=Sand, potash and lime melt into glass.
sd-bronze=Three parts copper, one part tin.
sd-glass-flask=Second science: glassware for experiments.
sd-bronze-tools=A faster drill and a faster arm.
sd-logistics-2=Roller chutes, underground chutes and splitters.
sd-rectification=Purer spirit and stronger acid, distilled into glass.
sd-second-awakening=Revival charge II: waves from the fourth on need it.
sd-hunting=A sling and stones, a palisade, meat roasted over the fire.
sd-tanning=Hides cured with lime into leather; a leather jacket.
sd-bow=A bow and bronze-tipped arrows.
sd-crossbow=A crossbow that shoots on its own.
sd-bone-meal=Ground bones make a garden bear more.
sd-wrought-iron=Iron from the bloomery: slow and coal-hungry, but iron.
