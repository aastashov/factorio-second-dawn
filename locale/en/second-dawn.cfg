[sd-message]
intro=Field log, day one. The stone around me has cracked. I can move again. Everything is overgrown; people are statues. Clay, fire and stone first.
newcomer=You were stone until a moment ago. You will be able to move in 3 minutes.
wave-warning=A petrification wave comes in __1__ min.
wave-charged=Wave __1__. The revival chamber spent its charge: everyone wakes up in a moment.
wave-no-charge=Wave __1__. No charge in the revival chamber. Statues thaw in __2__ min, or as soon as the chamber makes a charge.
revived-by-chamber=The revival chamber made a charge. Everyone wakes up.
thawed=The stone cracked on its own. You can move again.
chamber-exists=Only one revival chamber per team.
to-be-continued=That was the last wave of this version. More epochs are coming.

