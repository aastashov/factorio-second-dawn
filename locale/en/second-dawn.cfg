[entity-description]
sd-kiln=Burns charcoal only.
sd-alembic=Burns charcoal only.
sd-revival-chamber=Makes a revival charge into a sealed tank. When a petrification wave hits, the charge is spent and the whole team wakes up at once. One per team; stops while it holds a charge. Burns charcoal only.
sd-digger=Mines soft rock: stone, clay, shells, saltpeter.
sd-note=Pick it up to read it. Everyone on your team will know what it says.
sd-pick-digger=Mines soft and hard rock, slowly.
sd-bronze-drill=Mines soft and hard rock.
sd-bloomery=Smelts copper and tin, alloys bronze. Burns charcoal or coal.
sd-glassworks=Melts glass and blows bottles. Burns charcoal or coal.
sd-wolf-lair=Wolves attack anyone who comes within 25 tiles and raid buildings at night.
sd-boar-lair=Boars attack anyone who comes within 25 tiles. They do not raid.
sd-bear-den=Bears attack anyone who comes within 25 tiles and raid buildings at night.
sd-crossbow=Shoots arrows at animals in range.
sd-revival-chamber-2=Makes revival charges I to III. Build it over the old chamber; the charge inside the old one is lost. One per team.
sd-boar-farm=Captured boars: feed in, meat, hides and bones out.
sd-wolf-kennel=Captured wolves: meat in, hides and bones out.
sd-bear-pen=Captured bears: feed in, meat, hides and bones out.
steel-furnace=Smelts iron ore and makes steel. Burns coal or charcoal.
sd-brazier=Keeps buildings within 6 tiles from freezing while it burns.
sd-radiator=Warms buildings within 10 tiles. Consumes 1 steam per second.
sd-cooler=Cools buildings within 8 tiles. Consumes 10 water per second and electricity.

